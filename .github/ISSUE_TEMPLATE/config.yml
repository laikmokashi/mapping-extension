# The chooser shown at /issues/new/choose.
#
# blank_issues_enabled is false so every report arrives through a form. The forms ask for the
# things that make a dev-kit report actionable — the ref from .devkit-version, DUPLO_TARGET, which
# sample — and a blank issue collects none of them.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability — do not open an issue
    url: https://github.com/duplocloud/devkit/blob/main/SECURITY.md
    about: Email ai-reporting@duplocloud.net instead, so the fix can be worked privately and disclosed with you.
  - name: Production licensing
    url: mailto:sales@duplocloud.net
    about: The images this kit runs are licensed for local development only. Sales handles production licensing.
  - name: A problem in the DuploCloud platform itself
    url: https://duplocloud.com/contact/
    about: Bugs in the quay.io/duplocloud/* images come from the product, not this repo. Use your normal DuploCloud support channel.
